<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<title>Aplikazio erabileraren asteko grafikoa</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f6f9;
margin:40px;
text-align:center;
}

.autorea{
position:absolute;
top:10px;
right:20px;
font-size:14px;
color:#333;
}

select,input{
padding:6px;
margin:5px;
}

button{
padding:10px 15px;
margin:6px;
border:none;
border-radius:6px;
background:#2c7cff;
color:white;
cursor:pointer;
}

button:hover{
background:#1e5fd1;
}

table{
margin:auto;
border-collapse:collapse;
margin-top:15px;
}

td,th{
border:1px solid #ccc;
padding:6px 10px;
}

canvas{
background:white;
border-radius:10px;
margin-top:25px;
padding:10px;
}

</style>
</head>

<body>

<div class="autorea">
Sandra Sanchez Moya - IES ANTONIO TRUEBA BHI
</div>

<h2>Aplikazio baten asteko erabileraren grafikoa</h2>

<div>

<label>Neurketa mota:</label>

<select id="mota">
<option value="eguna">Egunero</option>
<option value="ordua">Orduka</option>
</select>

<label>Zenbat ordutik behin:</label>
<input type="number" id="orduak" value="6" min="1" max="24">

<button onclick="sortuTaula()">Datuak sartzeko taula sortu</button>

</div>

<div id="taula"></div>

<br>

<button onclick="sortuGrafikoa()">Grafikoa sortu</button>
<button onclick="berrabiarazi()">Berrabiarazi</button>
<button onclick="exportXLSX()">Excelera esportatu (.xlsx)</button>
<button onclick="deskargatuJPG()">JPG deskargatu</button>

<canvas id="grafikoa" width="900" height="450"></canvas>

<script>

let chart;
let labels=[];
let values=[];

const egunak=[
"Astelehena",
"Asteartea",
"Asteazkena",
"Osteguna",
"Ostirala",
"Larunbata",
"Igandea"
];

function sortuTaula(){

let mota=document.getElementById("mota").value;
let orduak=parseInt(document.getElementById("orduak").value);

labels=[];

let html="<table><tr><th>Denbora neurketa</th><th>Minutuak</th></tr>";

if(mota==="eguna"){

egunak.forEach((e,i)=>{

labels.push(e);

html+=`
<tr>
<td>${e}</td>
<td><input type="number" id="min${i}" min="0"></td>
</tr>`;

});

}else{

let index=0;

for(let d=0;d<7;d++){

for(let h=0;h<24;h+=orduak){

let etiketa=egunak[d]+" "+h+":00";

labels.push(etiketa);

html+=`
<tr>
<td>${etiketa}</td>
<td><input type="number" id="min${index}" min="0"></td>
</tr>`;

index++;

}

}

}

html+="</table>";

document.getElementById("taula").innerHTML=html;

}

function sortuGrafikoa(){

values=[];

labels.forEach((l,i)=>{

let v=parseInt(document.getElementById("min"+i).value);

if(isNaN(v)){v=0}

values.push(v);

});

const ctx=document.getElementById("grafikoa");

if(chart) chart.destroy();

chart=new Chart(ctx,{

type:'line',

data:{
labels:labels,
datasets:[{
data:values,
borderColor:'#8fd3ff',
backgroundColor:'#8fd3ff',
pointBackgroundColor:'#8fd3ff',
pointRadius:5,
fill:false,
tension:0
}]
},

options:{

plugins:{
legend:{display:false}
},

scales:{

x:{
title:{
display:true,
text:'Denbora neurketak'
}
},

y:{
title:{
display:true,
text:'Aplikazioa erabilitako minutuak'
},
ticks:{
stepSize:10
},
beginAtZero:true
}

}

}

});

}

function berrabiarazi(){

if(chart) chart.destroy();

document.getElementById("taula").innerHTML="";
labels=[];
values=[];

}

function exportXLSX(){

let data=[["Denbora neurketa","Minutuak"]];

labels.forEach((l,i)=>{

data.push([l,values[i]]);

});

let wb=XLSX.utils.book_new();

let ws=XLSX.utils.aoa_to_sheet(data);

XLSX.utils.book_append_sheet(wb,ws,"Datuak");

XLSX.writeFile(wb,"asteko_erabilera.xlsx");

}

function deskargatuJPG(){

let canvas=document.getElementById("grafikoa");

let link=document.createElement("a");

link.download="grafikoa.jpg";

link.href=canvas.toDataURL("image/jpeg",1.0);

link.click();

}

</script>

</body>
</html>
